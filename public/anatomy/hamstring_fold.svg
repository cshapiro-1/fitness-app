<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-synergist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /><stop offset="60%" stop-color="#0284c7" /><stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="synergist-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="420" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#38bdf8" filter="url(#glow-primary)"/>
    <text x="36" y="27" fill="#f8fafc" font-size="14" font-weight="800" letter-spacing="0.5">STANDING HAMSTRING FOLD</text>
    <text x="330" y="27" fill="#38bdf8" font-size="11" font-weight="700">POSTERIOR CHAIN</text>
  </g>

  <!-- Floor / Prop Base Line -->
  <line x1="80" y1="540" x2="720" y2="540" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Base Anatomy Body -->
  <g fill="#1e293b" stroke="#334155" stroke-width="2">
    <circle cx="300" cy="380" r="24" fill="#334155" stroke="#475569" stroke-width="2"/>
           <path d="M 310 360 L 360 260 L 390 270 L 330 380 Z"/>
           <path d="M 360 260 L 370 540" stroke="#334155" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- Secondary / Synergist Muscles (Glowing Amber) -->
  <g filter="url(#glow-synergist)">
    <path d="M 370 460 L 370 530" stroke="url(#synergist-grad)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Primary Target Muscles (Glowing Cyan/Teal) -->
  <g filter="url(#glow-primary)">
    <path d="M 360 270 Q 400 350 370 440 L 350 440 Q 365 350 345 280 Z" fill="url(#primary-grad)" stroke="#7dd3fc" stroke-width="2"/>
  </g>

  <!-- Kinesiology Callout Card -->
  <g transform="translate(480, 100)">
    <rect width="280" height="100" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="24" fill="#38bdf8" font-size="11" font-weight="800">TARGET: HAMSTRINGS & GASTROCNEMIUS</text>
    <text x="14" y="44" fill="#f8fafc" font-size="11" font-weight="600">• Hinge deeply at hips</text>
    <text x="14" y="62" fill="#f8fafc" font-size="11" font-weight="600">• Maintain soft bend in knees</text>
    <text x="14" y="80" fill="#f8fafc" font-size="11" font-weight="600">• Let head and neck hang heavy</text>
  </g>
</svg>