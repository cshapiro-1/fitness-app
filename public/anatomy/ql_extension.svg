<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="ql-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" /><stop offset="70%" stop-color="#ef4444" /><stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="400" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="6" fill="#f97316" filter="url(#glow-orange)"/>
    <text x="36" y="26" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="0.5">QL &amp; LATERAL EXTENSION</text>
    <text x="255" y="25" fill="#38bdf8" font-size="11" font-weight="700">QUADRATUS LUMBORUM</text>
  </g>

  <!-- Side-Lying 45° Roman Chair Frame -->
  <g stroke="#334155" stroke-width="14" stroke-linecap="round">
    <line x1="200" y1="520" x2="400" y2="320" stroke="#475569" stroke-width="18"/>
    <line x1="200" y1="520" x2="520" y2="520" stroke="#1e293b" stroke-width="16"/>
    <!-- Lateral Hip Pad -->
    <rect x="360" y="280" width="80" height="30" rx="8" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Athlete Side-Lying with Lateral Flexion -->
  <!-- Anchored Legs (Scissor Stance) -->
  <path d="M 230 490 L 390 310" stroke="#334155" stroke-width="26" stroke-linecap="round"/>

  <!-- Lateral Torso -->
  <path d="M 390 300 L 560 210" stroke="#1e293b" stroke-width="32" stroke-linecap="round"/>

  <!-- TARGET MUSCLE: Quadratus Lumborum & External Obliques (Lateral Flank) -->
  <g filter="url(#glow-orange)">
    <!-- Lower Flank QL Area -->
    <path d="M 400 280 Q 430 260 465 240 Q 470 280 415 310 Z" fill="url(#ql-grad)" stroke="#fca5a5" stroke-width="2"/>
    <path d="M 420 270 L 455 250" stroke="#fef08a" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Head & Crossed Hands Behind Head -->
  <circle cx="585" cy="190" r="24" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M 550 200 Q 570 170 590 180" stroke="#475569" stroke-width="12" stroke-linecap="round"/>

  <!-- Callouts -->
  <g transform="translate(460, 310)">
    <line x1="0" y1="-20" x2="-30" y2="-40" stroke="#f97316" stroke-width="2"/>
    <rect x="0" y="-30" width="240" height="50" rx="8" fill="#111827" stroke="#f97316" stroke-width="1.5"/>
    <text x="12" y="-10" fill="#f97316" font-size="13" font-weight="800">Quadratus Lumborum (QL)</text>
    <text x="12" y="6" fill="#cbd5e1" font-size="10">Deep lateral spinal core stability</text>
  </g>
</svg>
