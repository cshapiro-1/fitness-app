<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="rear-delt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" /><stop offset="60%" stop-color="#f97316" /><stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="380" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="6" fill="#f97316" filter="url(#glow-orange)"/>
    <text x="36" y="26" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="0.5">CABLE ROPE FACE PULL</text>
    <text x="240" y="25" fill="#38bdf8" font-size="11" font-weight="700">REAR DELTS &amp; ROTATORS</text>
  </g>

  <!-- Cable Pulley Machine (Eye Level) -->
  <g transform="translate(100, 180)">
    <rect x="0" y="-80" width="20" height="400" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="10" cy="50" r="14" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Cable Line to Athlete -->
    <path d="M 10 50 L 380 190 M 10 50 L 380 230" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 3"/>
  </g>

  <!-- Athlete Figure (External Rotation & Scapular Retraction) -->
  <!-- Upper Back (Posterior View) -->
  <g transform="translate(180, 40)">
    <!-- Head & Neck -->
    <circle cx="340" cy="120" r="26" fill="#334155" stroke="#475569" stroke-width="2"/>
    
    <!-- Torso Spine & Rhomboids -->
    <path d="M 320 150 Q 280 240 290 360 L 390 360 Q 400 240 360 150 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- WORKING TARGET MUSCLES: Rear Delts & Infraspinatus (Glowing Orange/Red) -->
    <g filter="url(#glow-orange)">
      <!-- Left Rear Deltoid -->
      <path d="M 280 160 Q 240 180 230 205 Q 260 220 285 190 Z" fill="url(#rear-delt-grad)" stroke="#fca5a5" stroke-width="1.5"/>
      <!-- Right Rear Deltoid -->
      <path d="M 400 160 Q 440 180 450 205 Q 420 220 395 190 Z" fill="url(#rear-delt-grad)" stroke="#fca5a5" stroke-width="1.5"/>
      <!-- Rhomboids & Mid Traps -->
      <path d="M 310 180 L 370 180 L 360 230 L 320 230 Z" fill="#f97316" opacity="0.85" stroke="#fca5a5" stroke-width="1.5"/>
    </g>

    <!-- Arms in Double-Biceps High Flared Pull -->
    <path d="M 240 200 L 190 190 Q 180 230 200 235" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
    <path d="M 440 200 L 490 190 Q 500 230 480 235" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Hands Gripping Rope Flare -->
    <circle cx="200" cy="235" r="10" fill="#64748b"/>
    <circle cx="480" cy="235" r="10" fill="#64748b"/>
  </g>

  <!-- Callouts -->
  <g transform="translate(480, 160)">
    <line x1="0" y1="50" x2="60" y2="10" stroke="#f97316" stroke-width="2"/>
    <rect x="60" y="0" width="220" height="46" rx="8" fill="#111827" stroke="#f97316" stroke-width="1.5"/>
    <text x="12" y="20" fill="#f97316" font-size="13" font-weight="800">Posterior Deltoids</text>
    <text x="12" y="34" fill="#cbd5e1" font-size="10">Shoulder external rotation</text>
  </g>
</svg>
