<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="erector-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" /><stop offset="60%" stop-color="#f97316" /><stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="380" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444" filter="url(#glow-red)"/>
    <text x="36" y="26" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="0.5">45° BACK HYPEREXTENSION</text>
    <text x="260" y="25" fill="#38bdf8" font-size="11" font-weight="700">ERECTORS &amp; GLUTES</text>
  </g>

  <!-- 45 Degree Roman Chair Frame -->
  <g stroke="#334155" stroke-width="14" stroke-linecap="round">
    <line x1="200" y1="520" x2="400" y2="320" stroke="#475569" stroke-width="18"/>
    <line x1="200" y1="520" x2="520" y2="520" stroke="#1e293b" stroke-width="16"/>
    <line x1="380" y1="340" x2="460" y2="520" stroke="#334155" stroke-width="12"/>
    <!-- Thigh Pad -->
    <rect x="360" y="280" width="80" height="30" rx="8" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Ankle Roller -->
    <circle cx="220" cy="500" r="16" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Athlete Figure Extending Upright to Straight Neutral Line -->
  <!-- Legs Anchored -->
  <path d="M 230 490 L 390 310" stroke="#334155" stroke-width="26" stroke-linecap="round"/>

  <!-- Gluteus Maximus Highlight -->
  <g filter="url(#glow-red)">
    <circle cx="390" cy="300" r="28" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
  </g>

  <!-- Torso in Straight Alignment with Thighs (45° Angle) -->
  <path d="M 390 300 L 560 170" stroke="#1e293b" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Erector Spinae (Spinalis, Longissimus, Iliocostalis) Running along Spine -->
  <g filter="url(#glow-red)">
    <path d="M 405 290 L 545 180" stroke="url(#erector-grad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 410 280 L 535 185" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Head & Crossed Arms -->
  <circle cx="590" cy="145" r="24" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M 540 200 Q 520 220 500 210" stroke="#475569" stroke-width="14" stroke-linecap="round"/>

  <!-- Callouts -->
  <g transform="translate(480, 260)">
    <line x1="0" y1="0" x2="-40" y2="-40" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="-20" width="220" height="46" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
    <text x="12" y="0" fill="#ef4444" font-size="13" font-weight="800">Erector Spinae</text>
    <text x="12" y="14" fill="#cbd5e1" font-size="10">Deep spinal extension stability</text>
  </g>
</svg>
