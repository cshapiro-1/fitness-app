<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-synergist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /><stop offset="60%" stop-color="#0284c7" /><stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="synergist-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="440" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#38bdf8" filter="url(#glow-primary)"/>
    <text x="36" y="27" fill="#f8fafc" font-size="14" font-weight="800" letter-spacing="0.5">STANDING DUMBBELL BICEP CURL</text>
    <text x="340" y="27" fill="#38bdf8" font-size="11" font-weight="700">BICEPS BRACHII & SUPINATION</text>
  </g>

  <!-- Floor / Prop Base Line -->
  <line x1="80" y1="540" x2="720" y2="540" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Base Anatomy Body -->
  <g fill="#1e293b" stroke="#334155" stroke-width="2">
    <circle cx="340" cy="180" r="26" fill="#334155"/>
           <path d="M 320 210 L 360 210 L 350 460 L 330 460 Z"/>
           <path d="M 310 220 L 310 320 L 280 240" stroke="#475569" stroke-width="18" stroke-linecap="round" fill="none"/>
           <circle cx="280" cy="230" r="14" fill="#64748b"/>
  </g>

  <!-- Secondary / Synergist Muscles (Glowing Amber) -->
  <g filter="url(#glow-synergist)">
    <path d="M 290 270 L 285 240" stroke="url(#synergist-grad)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Primary Target Muscles (Glowing Cyan/Teal) -->
  <g filter="url(#glow-primary)">
    <path d="M 305 240 Q 280 280 305 310 Q 320 280 315 240 Z" fill="url(#primary-grad)" stroke="#7dd3fc" stroke-width="2"/>
  </g>

  <!-- Kinesiology Callout Card -->
  <g transform="translate(480, 100)">
    <rect width="290" height="106" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="24" fill="#38bdf8" font-size="11" font-weight="800">TARGET: BICEPS BRACHII (SHORT & LONG HEADS)</text>
    <text x="14" y="46" fill="#f8fafc" font-size="11" font-weight="600">• Pin elbows to ribcage</text>
    <text x="14" y="65" fill="#f8fafc" font-size="11" font-weight="600">• Supinate wrist on the ascent</text>
    <text x="14" y="84" fill="#f8fafc" font-size="11" font-weight="600">• Full bottom elbow extension stretch</text>
  </g>
</svg>