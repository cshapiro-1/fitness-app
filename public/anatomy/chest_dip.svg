<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="pec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" /><stop offset="60%" stop-color="#dc2626" /><stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="synergist-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="400" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#ef4444" filter="url(#glow-red)"/>
    <text x="36" y="27" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="0.5">CHEST DIP (FORWARD TORSO LEAN)</text>
    <text x="315" y="27" fill="#38bdf8" font-size="11" font-weight="700">LOWER PEC BIAS</text>
  </g>

  <!-- Parallel Dip Apparatus -->
  <g stroke="#475569" stroke-width="12" stroke-linecap="round">
    <line x1="200" y1="300" x2="200" y2="560" />
    <line x1="600" y1="300" x2="600" y2="560" />
    <line x1="160" y1="300" x2="640" y2="300" stroke="#64748b" stroke-width="16"/>
  </g>

  <!-- Forward Angled Torso (30° Anterior Lean for Lower Pec Sternal Isolation) -->
  <!-- Head & Neck -->
  <circle cx="360" cy="150" r="26" fill="#334155" stroke="#475569" stroke-width="2"/>

  <!-- Torso with 30° Forward Lean -->
  <path d="M 370 185 L 430 360 L 370 380 L 310 200 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Lower Pectoralis Major - PRIMARY TARGET (Glowing Red) -->
  <g filter="url(#glow-red)">
    <path d="M 345 205 Q 385 270 415 275 Q 395 230 355 195 Z" fill="url(#pec-grad)" stroke="#f87171" stroke-width="2"/>
    <path d="M 355 220 Q 380 255 405 260" stroke="#fca5a5" stroke-width="2" fill="none"/>
    <path d="M 365 235 Q 385 260 400 255" stroke="#fca5a5" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Anterior Deltoid (Glowing Amber Synergist) -->
  <g filter="url(#glow-amber)">
    <circle cx="330" cy="195" r="16" fill="url(#synergist-grad)" stroke="#fef08a" stroke-width="1.5"/>
  </g>

  <!-- Triceps Brachii (Bent Upper Arm at 90°) -->
  <g filter="url(#glow-amber)">
    <path d="M 320 200 L 260 270 Q 275 285 315 240 Z" fill="url(#synergist-grad)" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 420 200 L 480 270 Q 465 285 425 240 Z" fill="url(#synergist-grad)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Forearms Vertically Stacked on Bars -->
  <path d="M 260 270 L 260 300" stroke="#64748b" stroke-width="18" stroke-linecap="round"/>
  <path d="M 480 270 L 480 300" stroke="#64748b" stroke-width="18" stroke-linecap="round"/>

  <!-- Legs Tucked Back -->
  <path d="M 430 360 Q 490 420 460 490" stroke="#334155" stroke-width="24" stroke-linecap="round" fill="none"/>
  <circle cx="460" cy="490" r="12" fill="#475569"/>

  <!-- Biomechanics Callout -->
  <g transform="translate(480, 110)">
    <rect width="280" height="90" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="14" y="24" fill="#ef4444" font-size="12" font-weight="800">PRIMARY: LOWER PECTORALIS</text>
    <text x="14" y="44" fill="#f8fafc" font-size="11" font-weight="600">• 30° Forward Torso Lean</text>
    <text x="14" y="62" fill="#f8fafc" font-size="11" font-weight="600">• Flared Elbows at 45-60°</text>
    <text x="14" y="80" fill="#94a3b8" font-size="10">Synergists: Anterior Delt &amp; Triceps</text>
  </g>
</svg>
