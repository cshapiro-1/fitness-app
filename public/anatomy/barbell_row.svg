<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-synergist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /><stop offset="60%" stop-color="#0284c7" /><stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="synergist-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="420" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#38bdf8" filter="url(#glow-primary)"/>
    <text x="36" y="27" fill="#f8fafc" font-size="14" font-weight="800" letter-spacing="0.5">BARBELL BENT-OVER ROW</text>
    <text x="330" y="27" fill="#38bdf8" font-size="11" font-weight="700">UPPER BACK & LATS</text>
  </g>

  <!-- Floor / Prop Base Line -->
  <line x1="80" y1="540" x2="720" y2="540" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Base Anatomy Body -->
  <g fill="#1e293b" stroke="#334155" stroke-width="2">
    <circle cx="300" cy="220" r="26" fill="#334155" stroke="#475569" stroke-width="2"/>
           <path d="M 320 240 L 440 320 L 410 440 L 300 360 Z"/>
           <line x1="260" y1="420" x2="380" y2="420" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Secondary / Synergist Muscles (Glowing Amber) -->
  <g filter="url(#glow-synergist)">
    <circle cx="310" cy="250" r="16" fill="url(#synergist-grad)"/>
  </g>

  <!-- Primary Target Muscles (Glowing Cyan/Teal) -->
  <g filter="url(#glow-primary)">
    <path d="M 340 250 Q 420 290 400 360 Q 350 330 330 270 Z" fill="url(#primary-grad)" stroke="#7dd3fc" stroke-width="2"/>
  </g>

  <!-- Kinesiology Callout Card -->
  <g transform="translate(480, 100)">
    <rect width="280" height="100" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="24" fill="#38bdf8" font-size="11" font-weight="800">TARGET: LATISSIMUS DORSI & RHOMBOIDS</text>
    <text x="14" y="44" fill="#f8fafc" font-size="11" font-weight="600">• 45° torso hinge with flat spine</text>
    <text x="14" y="62" fill="#f8fafc" font-size="11" font-weight="600">• Drive elbows back into back pockets</text>
    <text x="14" y="80" fill="#f8fafc" font-size="11" font-weight="600">• Squeeze shoulder blades together</text>
  </g>
</svg>