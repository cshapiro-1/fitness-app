<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="quad-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" /><stop offset="70%" stop-color="#0891b2" /><stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="psoas-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="450" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#06b6d4" filter="url(#glow-teal)"/>
    <text x="36" y="27" fill="#f8fafc" font-size="15" font-weight="800">COUCH STRETCH (QUAD &amp; HIP FLEXOR)</text>
    <text x="355" y="27" fill="#38bdf8" font-size="11" font-weight="700">MOBILITY</text>
  </g>

  <!-- Wall / Couch Backing -->
  <rect x="620" y="200" width="24" height="340" rx="4" fill="#334155"/>
  <line x1="120" y1="540" x2="680" y2="540" stroke="#475569" stroke-width="6"/>

  <!-- Athlete Figure in Couch Stretch Lunge -->
  <!-- Head & Upright Torso -->
  <circle cx="340" cy="180" r="26" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M 320 210 L 360 210 L 365 370 L 315 370 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Front Leg (Bent at 90° Knee) -->
  <path d="M 315 370 L 220 370 L 220 540" stroke="#334155" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Front Foot Flat -->
  <rect x="180" y="530" width="70" height="14" rx="4" fill="#475569"/>

  <!-- Rear Leg: Knee on Floor, Shin Vertically Against Wall -->
  <!-- Deep Psoas & Iliacus (Glowing Amber) -->
  <g filter="url(#glow-orange)">
    <path d="M 345 350 Q 375 390 390 420 Q 370 410 340 370 Z" fill="url(#psoas-grad)" stroke="#fef08a" stroke-width="1.5"/>
  </g>

  <!-- Rectus Femoris & Quad Anterior Compartment (Glowing Cyan Stretch Zone) -->
  <g filter="url(#glow-teal)">
    <path d="M 365 370 Q 420 410 445 490 Q 420 480 380 430 Z" fill="url(#quad-grad)" stroke="#67e8f9" stroke-width="2"/>
    <path d="M 380 390 Q 420 430 435 480" stroke="#a5f3fc" stroke-width="2" fill="none"/>
    <path d="M 395 405 Q 430 445 440 475" stroke="#cffafe" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Rear Shin Vertical Along Wall -->
  <path d="M 445 490 L 610 300" stroke="#334155" stroke-width="24" stroke-linecap="round" fill="none"/>
  <!-- Rear Knee Pad -->
  <rect x="420" y="525" width="50" height="15" rx="4" fill="#64748b"/>

  <!-- Kinesiology Callout -->
  <g transform="translate(40, 110)">
    <rect width="260" height="90" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="14" y="24" fill="#06b6d4" font-size="12" font-weight="800">TARGET: RECTUS FEMORIS &amp; PSOAS</text>
    <text x="14" y="44" fill="#f8fafc" font-size="11" font-weight="600">• Posterior Pelvic Tilt (Glute Squeeze)</text>
    <text x="14" y="62" fill="#f8fafc" font-size="11" font-weight="600">• Upright Torso (Avoid Lumbar Arch)</text>
    <text x="14" y="80" fill="#94a3b8" font-size="10">Synergists: TFL, Sartorius &amp; Iliacus</text>
  </g>
</svg>
