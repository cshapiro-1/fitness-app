<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Muscle Gradients -->
    <linearGradient id="quad-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="glute-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="360" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444" filter="url(#glow-orange)"/>
    <text x="36" y="26" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="0.5">BULGARIAN SPLIT SQUAT</text>
    <text x="270" y="25" fill="#38bdf8" font-size="11" font-weight="700">UNILATERAL KIN</text>
  </g>

  <!-- Gym Bench (Rear Foot Elevation) -->
  <g transform="translate(110, 360)">
    <!-- Bench top pad -->
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Bench legs -->
    <path d="M 30 24 L 20 180 M 150 24 L 160 180" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <!-- Bench feet base -->
    <path d="M 5 180 L 45 180 M 135 180 L 175 180" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <text x="45" y="15" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">ELEVATION BENCH</text>
  </g>

  <!-- Floor Grid -->
  <line x1="40" y1="540" x2="760" y2="540" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="80" y1="540" x2="720" y2="540" stroke="#334155" stroke-width="1"/>

  <!-- Unilateral Biomechanics Lines -->
  <!-- 90 Degree Front Knee Angle Guide -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="560" y1="360" x2="560" y2="535" />
    <line x1="560" y1="360" x2="420" y2="350" />
    <circle cx="560" cy="360" r="4" fill="#38bdf8" />
  </g>
  <rect x="546" y="346" width="14" height="14" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Athlete Figure (Split Squat Form) -->
  <!-- Rear Leg (Elevated on Bench) -->
  <g stroke="#0f172a" stroke-width="2">
    <!-- Elevated Rear Foot -->
    <path d="M 210 360 C 230 350, 240 365, 260 370" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
    <!-- Rear Shin / Lower Leg -->
    <path d="M 240 365 L 290 410" fill="none" stroke="#334155" stroke-width="22" stroke-linecap="round"/>
    <!-- Rear Knee & Quad (Hip Flexor Stretch) -->
    <path d="M 290 410 Q 340 425 390 350" fill="none" stroke="#475569" stroke-width="28" stroke-linecap="round"/>
    <!-- Rear Rectus Femoris / Hip Flexor Highlight (Mild orange stretch) -->
    <path d="M 310 405 Q 350 415 385 355" fill="none" stroke="#ea580c" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Torso & Arms (Dumbbell Loaded) -->
  <g>
    <!-- Head & Neck -->
    <circle cx="410" cy="140" r="28" fill="#334155" stroke="#475569" stroke-width="2"/>
    <path d="M 405 168 L 408 195" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Torso (Slight 15° Forward Hip Hinge for Glute Max Tension) -->
    <path d="M 408 190 Q 425 260 410 340 L 375 340 Q 380 260 395 190 Z" fill="url(#body-grad)" stroke="#475569" stroke-width="2"/>
    <path d="M 400 210 Q 405 270 390 330" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3 3" opacity="0.6"/> <!-- Spine line -->

    <!-- Dumbbell & Arms (Hanging at Mid-Foot Plumbline) -->
    <path d="M 412 205 L 430 330" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
    <!-- Dumbbell in Hand -->
    <g transform="translate(415, 330)">
      <rect x="-8" y="0" width="36" height="14" rx="4" fill="#64748b"/>
      <rect x="-14" y="-12" width="12" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <rect x="22" y="-12" width="12" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    </g>
  </g>

  <!-- PRIMARY WORKING MUSCLE GROUPS (GLOWING OVERLAYS) -->
  <!-- 1. Gluteus Maximus & Medius (Target Anchor) -->
  <g filter="url(#glow-red)">
    <!-- Gluteus Maximus Shape -->
    <path d="M 370 330 Q 350 360 365 395 Q 395 410 425 385 Q 430 340 395 330 Z" fill="url(#glute-grad)" stroke="#ef4444" stroke-width="2"/>
    <!-- Muscle striations -->
    <path d="M 375 345 Q 385 375 415 380 M 365 365 Q 380 390 405 398" stroke="#fca5a5" stroke-width="1.5" fill="none" opacity="0.8"/>
  </g>

  <!-- 2. Front Working Quadriceps (Vastus Medialis, Vastus Lateralis, Rectus Femoris) -->
  <g filter="url(#glow-orange)">
    <!-- Main Quad Mass -->
    <path d="M 420 345 Q 490 330 560 355 Q 545 395 470 395 Q 430 390 415 365 Z" fill="url(#quad-grad)" stroke="#f97316" stroke-width="2"/>
    <!-- Vastus Medialis (Teardrop contraction over knee) -->
    <path d="M 520 355 Q 548 358 555 375 Q 535 390 515 385 Z" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- Vastus Lateralis sweep -->
    <path d="M 440 340 Q 480 335 525 348" stroke="#fef08a" stroke-width="2" fill="none"/>
    <path d="M 450 360 Q 490 355 535 365" stroke="#fef08a" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- Front Lower Leg (Vertical Tibia 90°) -->
  <g>
    <!-- Knee Joint Connection -->
    <circle cx="560" cy="360" r="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Front Tibia / Shin -->
    <path d="M 560 360 L 560 520" stroke="#334155" stroke-width="26" stroke-linecap="round"/>
    <!-- Soleus & Gastrocnemius (Calf) -->
    <path d="M 570 380 Q 585 430 570 480" stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <!-- Planted Front Foot (Weight through midfoot/heel) -->
    <path d="M 545 520 L 610 520 Q 615 538 595 538 L 540 538 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- ANATOMICAL CALLOUT LABELS & ARROWS -->
  <!-- 1. Gluteus Maximus Callout -->
  <g transform="translate(120, 240)">
    <line x1="250" y1="120" x2="150" y2="40" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="250" cy="120" r="4" fill="#f43f5e" filter="url(#glow-red)"/>
    <rect x="0" y="0" width="200" height="48" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="12" y="20" fill="#f43f5e" font-size="13" font-weight="800">Gluteus Maximus &amp; Medius</text>
    <text x="12" y="36" fill="#cbd5e1" font-size="10" font-weight="600">Deep eccentric hip stability</text>
  </g>

  <!-- 2. Quadriceps Femoris Callout -->
  <g transform="translate(480, 190)">
    <line x1="20" y1="160" x2="60" y2="40" stroke="#f97316" stroke-width="2"/>
    <circle cx="20" cy="160" r="4" fill="#f97316" filter="url(#glow-orange)"/>
    <rect x="60" y="0" width="230" height="60" rx="8" fill="#111827" stroke="#f97316" stroke-width="1.5"/>
    <text x="72" y="20" fill="#f97316" font-size="13" font-weight="800">Quadriceps Femoris</text>
    <text x="72" y="36" fill="#fef08a" font-size="11" font-weight="700">Vastus Lateralis &amp; Medialis</text>
    <text x="72" y="50" fill="#cbd5e1" font-size="10">Primary knee extensor load</text>
  </g>

  <!-- 3. Rear Foot Elevated Callout -->
  <g transform="translate(40, 480)">
    <line x1="200" y1="-100" x2="100" y2="-20" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="200" cy="-100" r="4" fill="#38bdf8"/>
    <rect x="0" y="-20" width="180" height="42" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="0" fill="#38bdf8" font-size="12" font-weight="800">Rear-Foot Elevation</text>
    <text x="12" y="14" fill="#94a3b8" font-size="10">De-loads lumbar &amp; spine</text>
  </g>

  <!-- 4. Form Cue Legend -->
  <g transform="translate(470, 460)">
    <rect width="280" height="65" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1">BIOMECHANICS CUE</text>
    <text x="14" y="38" fill="#f8fafc" font-size="11" font-weight="600">Keep front heel grounded at 90°.</text>
    <text x="14" y="52" fill="#94a3b8" font-size="10">Drive hips forward to full lockout.</text>
  </g>
</svg>
