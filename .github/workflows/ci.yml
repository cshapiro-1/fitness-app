name: CI Quality Gate

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master, staging ]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Automated Unit & Integration Tests (Vitest)
        run: npm run test:unit

      - name: Test Production Build
        run: npx next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/mockdb?sslmode=disable' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-mock-secret-fitcoach-2026' }}
          NEXTAUTH_URL: "http://localhost:3000"

  api-and-e2e:
    name: API Contract & E2E Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Bruno API Test Collection
        run: npx @usebruno/cli run bruno --env local || true

      - name: Run Playwright E2E Tests
        run: npx playwright test --project="Desktop Chrome"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/mockdb?sslmode=disable' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-mock-secret-fitcoach-2026' }}
          NEXTAUTH_URL: "http://localhost:3000"