name: STRKYR Automated CI & Bug Prevention Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-security-gate:
    name: Typecheck, Security Tests & Production Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/fitness?sslmode=disable"
      NEXTAUTH_SECRET: "ci-secret-key-32-chars-long-example"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma ORM Client
        run: npx prisma generate

      - name: 1. Strict TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: 2. Automated Vitest Unit & Integration Security Test Suite
        run: npm run test

      - name: 3. Next.js Production Compilation (Turbopack)
        run: npx next build