name: Android Cloud Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Web Assets
        run: npx next build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mockdb?sslmode=disable"
          NEXTAUTH_SECRET: "ci-build-mock-secret-fitcoach-2026"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK & Play Store AAB Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload Android Test APK
        uses: actions/upload-artifact@v4
        with:
          name: fitcoach-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: fitcoach-google-play-aab-bundle
          path: android/app/build/outputs/bundle/debug/app-debug.aab
