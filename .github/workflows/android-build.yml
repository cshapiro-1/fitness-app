name: Android Cloud Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Web Assets
        run: npx next build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mockdb?sslmode=disable"
          NEXTAUTH_SECRET: "ci-build-mock-secret-fitcoach-2026"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK & Play Store AAB Bundle
        run: |
          cd android/app
          if [ ! -f "strkyr-release.keystore" ]; then
            keytool -genkey -v -keystore strkyr-release.keystore -alias strkyr -keyalg RSA -keysize 2048 -validity 10000 -storepass "StrkyrRelease2026!" -keypass "StrkyrRelease2026!" -dname "CN=Collin Shapiro, OU=Mobile, O=STRKYR, L=Austin, ST=Texas, C=US"
          fi
          cd ..
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease assembleDebug --no-daemon
        env:
          KEYSTORE_FILE: "strkyr-release.keystore"
          KEYSTORE_PASSWORD: "StrkyrRelease2026!"
          KEY_ALIAS: "strkyr"
          KEY_PASSWORD: "StrkyrRelease2026!"

      - name: Upload Android Test APK
        uses: actions/upload-artifact@v4
        with:
          name: strkyr-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: strkyr-google-play-aab-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/debug/*.aab
